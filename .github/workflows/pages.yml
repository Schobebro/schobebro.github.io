name: Websites · GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build websites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test publication rules
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build public website
        run: python3 scripts/build.py
      - name: Build full draft preview
        run: python3 scripts/build.py --preview
      - name: Save preview for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: websites-preview
          path: build/preview/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - name: Package public website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/site/

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages address
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Verify canonical host
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ['PAGES_URL'].rstrip('/').lower() != 'https://schobebro.github.io':
              raise SystemExit('Pages URL differs from the canonical website host. Update the site configuration before deploying.')
          PY
      - name: Deploy websites
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
